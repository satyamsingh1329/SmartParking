<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | ParkPulse Smart Parking</title>
  <meta name="description" content="Sign in to your ParkPulse account to manage smart parking reservations.">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="/index.html" class="brand-logo">
        <div class="brand-icon">🚗</div>
        <span class="brand-name">ParkPulse</span>
      </a>

      <div class="nav-links">
        <a href="/index.html" class="nav-link">Home</a>
        <a href="/parking.html" class="nav-link">Find & Reserve</a>
      </div>

      <div class="nav-actions">
        <button class="theme-toggle-btn" aria-label="Toggle theme">☀️</button>
      </div>
    </div>
  </nav>

  <main style="max-width: 460px; margin: 3.5rem auto; padding: 0 1.5rem; width: 100%;">
    
    <div class="glass-card" style="padding: 2.25rem;">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div class="brand-icon" style="margin: 0 auto 1rem auto; width: 48px; height: 48px; font-size: 1.5rem;">🔐</div>
        <h1 style="font-size: 1.75rem; font-weight: 800; letter-spacing: -0.5px;">Welcome to ParkPulse</h1>
        <p style="color: var(--text-secondary); font-size: 0.88rem; margin-top: 0.35rem;">Enter credentials or select a demo account</p>
      </div>

      <!-- Quick Demo Login Buttons -->
      <div style="margin-bottom: 1.75rem; padding: 1rem; background: rgba(0,0,0,0.25); border-radius: var(--radius-md); border: 1px solid var(--border-color);">
        <span style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; display: block; margin-bottom: 0.65rem;">
          ⚡ 1-Click Demo Profiles:
        </span>
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem;">
          <button type="button" class="btn btn-secondary btn-sm demo-login-btn" data-email="user@parkpulse.com" data-pass="user123">
            User
          </button>
          <button type="button" class="btn btn-secondary btn-sm demo-login-btn" data-email="gatekeeper@parkpulse.com" data-pass="gate123" style="color: var(--amber);">
            Gatekeeper
          </button>
          <button type="button" class="btn btn-secondary btn-sm demo-login-btn" data-email="admin@parkpulse.com" data-pass="admin123" style="color: #ef4444;">
            Admin
          </button>
        </div>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="login-email" class="form-control" placeholder="user@parkpulse.com" required>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between;">
            <label class="form-label">Password</label>
          </div>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-login-submit" style="margin-top: 1rem;">
          Sign In
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: var(--text-secondary);">
        Don't have an account? <a href="/register.html" style="color: var(--primary); font-weight: 600;">Sign up (+50 Bonus Points)</a>
      </div>
    </div>

  </main>

  <script type="module">
    import { initTheme, showToast } from '/js/utils.js';
    import { loginUser } from '/js/auth.js';

    document.addEventListener('DOMContentLoaded', () => {
      initTheme();

      // Demo autofill buttons
      document.querySelectorAll('.demo-login-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.getElementById('login-email').value = btn.getAttribute('data-email');
          document.getElementById('login-password').value = btn.getAttribute('data-pass');
          document.getElementById('login-form').dispatchEvent(new Event('submit'));
        });
      });

      document.getElementById('login-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        const pass = document.getElementById('login-password').value;
        const submitBtn = document.getElementById('btn-login-submit');

        submitBtn.disabled = true;
        submitBtn.innerHTML = 'Authenticating...';

        try {
          const user = await loginUser(email, pass);
          const urlParams = new URLSearchParams(window.location.search);
          const redirect = urlParams.get('redirect');

          setTimeout(() => {
            if (redirect) {
              window.location.href = redirect;
            } else if (user.role === 'ADMIN') {
              window.location.href = '/admin.html';
            } else if (user.role === 'GATEKEEPER') {
              window.location.href = '/gatekeeper.html';
            } else {
              window.location.href = '/dashboard.html';
            }
          }, 600);
        } catch (err) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Sign In';
        }
      });
    });
  </script>
</body>
</html>
