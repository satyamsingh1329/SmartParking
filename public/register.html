<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an Account | ParkPulse</title>
  <meta name="description" content="Register for ParkPulse and get 50 bonus reward points for smart parking reservations.">
  <link rel="stylesheet" href="./css/style.css">
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="./index.html" class="brand-logo">
        <div class="brand-icon">🚗</div>
        <span class="brand-name">ParkPulse</span>
      </a>

      <div class="nav-links">
        <a href="./index.html" class="nav-link">Home</a>
        <a href="./parking.html" class="nav-link">Find & Reserve</a>
      </div>

      <div class="nav-actions">
        <button class="theme-toggle-btn" aria-label="Toggle theme">☀️</button>
      </div>
    </div>
  </nav>

  <main style="max-width: 480px; margin: 3rem auto; padding: 0 1.5rem; width: 100%;">
    
    <div class="glass-card" style="padding: 2.25rem;">
      <div style="text-align: center; margin-bottom: 2rem;">
        <span class="badge badge-available" style="margin-bottom: 0.5rem;">+50 WELCOME BONUS POINTS</span>
        <h1 style="font-size: 1.75rem; font-weight: 800; letter-spacing: -0.5px;">Create Your Account</h1>
        <p style="color: var(--text-secondary); font-size: 0.88rem; margin-top: 0.35rem;">Join the smart parking revolution</p>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" id="reg-name" class="form-control" placeholder="Alex Rivera" required>
        </div>

        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="reg-email" class="form-control" placeholder="alex@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">Mobile Phone Number</label>
          <input type="tel" id="reg-phone" class="form-control" placeholder="+91 9876543210" required>
        </div>

        <div class="form-group">
          <label class="form-label">Account Role</label>
          <select id="reg-role" class="form-control">
            <option value="USER" selected>Driver / Commuter (User)</option>
            <option value="GATEKEEPER">Gatekeeper / Barrier Staff</option>
            <option value="ADMIN">Facility Administrator</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Security Password</label>
          <input type="password" id="reg-password" class="form-control" placeholder="At least 6 characters" minlength="6" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-reg-submit" style="margin-top: 1rem;">
          Register & Claim 50 Points
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: var(--text-secondary);">
        Already have an account? <a href="./login.html" style="color: var(--primary); font-weight: 600;">Sign In</a>
      </div>
    </div>

  </main>

  <script type="module">
    import { initTheme } from './js/utils.js';
    import { registerUser } from './js/auth.js';

    document.addEventListener('DOMContentLoaded', () => {
      initTheme();

      document.getElementById('register-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('reg-name').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const phone = document.getElementById('reg-phone').value.trim();
        const role = document.getElementById('reg-role').value;
        const password = document.getElementById('reg-password').value;
        const submitBtn = document.getElementById('btn-reg-submit');

        submitBtn.disabled = true;
        submitBtn.innerHTML = 'Registering Account...';

        try {
          const user = await registerUser({ name, email, phone, role, password });
          setTimeout(() => {
            if (user.role === 'ADMIN') {
              window.location.href = './admin.html';
            } else if (user.role === 'GATEKEEPER') {
              window.location.href = './gatekeeper.html';
            } else {
              window.location.href = './dashboard.html';
            }
          }, 800);
        } catch (err) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Register & Claim 50 Points';
        }
      });
    });
  </script>
</body>
</html>
